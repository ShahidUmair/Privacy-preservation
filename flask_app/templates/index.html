<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📊 Screen Activity Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>📸 Screen Activity Tracker</h1>
        <p>Track how much time you spend on different types of screen activities.</p>
        <div class="tracking-controls">
            <button id="startTrackingButton" onclick="startTracking()">Start Tracking</button>
            <button id="stopTrackingButton" onclick="stopTracking()" disabled>Stop Tracking</button>
        </div>
        <p id="trackingStatus" role="status" aria-live="polite">Tracking is stopped.</p>

        <div class="chart-section">
            <canvas id="activityChart"></canvas>
        </div>

        <footer>
            <p>&copy; 2024 Screen Activity Tracker. All rights reserved.</p>
        </footer>
    </div>
    <script src="/static/js/script.js"></script>
</body>
</html>
